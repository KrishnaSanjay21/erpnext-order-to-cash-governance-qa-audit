x-erpnext-image: &erpnext_image
  image: frappe/erpnext:${ERPNEXT_VERSION:-v16.50.0}
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-audit_dev_only}
      MARIADB_AUTO_UPGRADE: 1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *erpnext_image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache redis://redis-cache:6379;
        bench set-config -g redis_queue redis://redis-queue:6379;
        bench set-config -g redis_socketio redis://redis-queue:6379;
        bench set-config -gp socketio_port 9000;
    depends_on:
      db:
        condition: service_healthy

  create-site:
    <<: *erpnext_image
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 180 db:3306;
        wait-for-it -t 180 redis-cache:6379;
        wait-for-it -t 180 redis-queue:6379;
        until test -f sites/common_site_config.json; do sleep 5; done;
        if [ -d sites/${ERPNEXT_SITE:-frontend} ]; then
          echo "Site already exists";
        else
          bench new-site --mariadb-user-host-login-scope='%'
          --admin-password='${ERPNEXT_ADMIN_PASSWORD:-admin}'
          --db-root-username=root
          --db-root-password='${DB_ROOT_PASSWORD:-audit_dev_only}'
          --install-app erpnext
          --set-default ${ERPNEXT_SITE:-frontend};
        fi
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *erpnext_image
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  frontend:
    <<: *erpnext_image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE:-frontend}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${ERPNEXT_PORT:-8080}:8080"
    depends_on: [backend, websocket]

  queue:
    <<: *erpnext_image
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  scheduler:
    <<: *erpnext_image
    command: ["bench", "schedule"]
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    <<: *erpnext_image
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

