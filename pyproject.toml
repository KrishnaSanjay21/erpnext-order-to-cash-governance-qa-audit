[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erpnext-order-to-cash-governance-qa-audit"
version = "0.1.0"
description = "ERPNext order-to-cash migration, governance, reconciliation, and QA controls"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Krishna Sanjay"}]
dependencies = [
  "duckdb>=1.2,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
  "tenacity>=9,<10",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.scripts]
otc-audit = "otc_audit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=otc_audit --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

